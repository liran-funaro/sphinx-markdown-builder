name: CI/CD

on: [ push, pull_request ]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.14" ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade flake8 pylint
          pip install .[dev]
      - name: Lint
        run: make lint
      - name: Build distribution
        run: make dist

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pytest pytest-cov
          pip install .[dev]
      - name: Test
        run: make test
      - name: Coveralls
        if: ${{ !env.ACT }} # skip during local actions testing
        uses: coverallsapp/github-action@v2
        with:
          format: cobertura
          file: coverage.xml
          flag-name: python-${{ matrix.python-version }}
          parallel: true
        continue-on-error: true

  test-min-sphinx:
    # Build the test docs with the oldest Sphinx allowed by `dependencies` in pyproject.toml.
    # The output differs between Sphinx versions, so this only checks that the builds succeed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11  # Sphinx 5.1 imports `imghdr`, which Python 3.13 removed
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          # Downgrade Sphinx (and its pinned dependencies, e.g., docutils) after the regular install.
          # pip reports that the dev extra and some extensions ask for a newer Sphinx; the builds still work.
          pip install "sphinx==5.1.0"
      - name: Test
        run: pytest tests/test_builder.py

  coveralls:
    if: ${{ always() && !github.event.act }} # skip during local actions testing
    name: Indicate completion to coveralls.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
        continue-on-error: true
